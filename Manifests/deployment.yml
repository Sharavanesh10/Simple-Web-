apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploymentone
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: devcontcr.azurecr.io/hello-app:$(Build.BuildId)
        ports:
        - containerPort: 80
